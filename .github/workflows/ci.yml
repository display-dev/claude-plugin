name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bundled skills match their pinned sources
        run: tools/sync.sh --check

      - name: Visualize permission adaptation
        run: node --test tests/visualize-permissions.test.mjs

      - name: JSON manifests parse
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty hooks/hooks.json

      - name: Version matches every attribution literal
        run: |
          want="$(jq -r .version .claude-plugin/plugin.json)"
          echo "plugin version = $want"
          status=0
          header="$(jq -r '.mcpServers["display-dev"].headers["X-Client-Source"]' .claude-plugin/plugin.json | sed 's/.*@//')"
          [ "$header" = "$want" ] || { echo "MCP X-Client-Source suffix is '$header'" >&2; status=1; }
          for v in $(grep -oE 'display-dev-claude-plugin@[0-9]+\.[0-9]+\.[0-9]+' commands/feedback.md | sed 's/.*@//' | sort -u); do
            [ "$v" = "$want" ] || { echo "commands/feedback.md uses '$v'" >&2; status=1; }
          done
          exit $status

      - name: Scripts stay executable
        run: |
          status=0
          for script in hooks/*.sh tools/*.sh tests/*.sh tests/fixtures/digest-dsp/dsp; do
            [ -x "$script" ] || { echo "not executable: $script" >&2; status=1; }
          done
          exit $status

      - name: Hook tests
        run: bash tests/hooks.sh

      - name: ShellCheck
        # Pinned by full commit SHA (v2.0.0).
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: ./hooks
          severity: warning

  visualize-permissions-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned native Claude for this runner
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/claude-permissions" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code-win32-x64@2.1.306
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact scripts run and neighboring scripts require approval
        shell: pwsh
        run: |
          $env:CLAUDE_EXECUTABLE = "$env:RUNNER_TEMP/claude-permissions/node_modules/@anthropic-ai/claude-code-win32-x64/bin/claude.exe"
          node tests/visualize-permissions-native.mjs
